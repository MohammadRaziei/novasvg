name: python build wheels

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ master ]

env:
  FORCE_COLOR: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: false

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Build SDist
      run: pipx run build --sdist

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: wheelhouse-sdist
        path: dist/*.tar.gz
        overwrite: true


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # ubuntu-24.04-arm is a native ARM64 runner (no QEMU emulation), so it
        # produces manylinux/musllinux aarch64 wheels in the same time as x86_64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.2.1
      env:
        CIBW_ARCHS_MACOS: universal2
        # 3.9-3.11: normal per-version build. 3.12: built once as cp312-abi3
        # (see [[tool.cibuildwheel.overrides]] in pyproject.toml) and that
        # single wheel covers every newer interpreter, so 3.13+ is not built.
        CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
        # Disable building PyPy wheels on all platforms
        CIBW_SKIP: pp*

    - uses: actions/upload-artifact@v7
      with:
        name: wheelhouse-${{ matrix.os }}
        path: wheelhouse/*.whl
        overwrite: false
