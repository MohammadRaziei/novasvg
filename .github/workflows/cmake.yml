name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install python deps
      run: pip install pytest-cov nanobind
    
    - name: Use cmake
      run: cmake --version

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DNOVASVG_BUILD_EXAMPLES=ON \
          -DNOVASVG_BUILD_PYTHON=ON \
          -DNOVASVG_BUILD_TESTS=ON \
          -DNOVASVG_BUILD_DOCS=OFF

    - name: Build
      run: cmake --build build -j4

    - name: Run tests
      run: ctest --test-dir build --output-on-failure --extra-verbose
      

  build-docs:
    needs: build-and-test
    # if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'
    
    - name: Install apt dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DNOVASVG_BUILD_EXAMPLES=OFF \
          -DNOVASVG_BUILD_PYTHON=OFF \
          -DNOVASVG_BUILD_TESTS=OFF \
          -DNOVASVG_BUILD_DOCS=ON

    - name: Build documentation
      run: cmake --build build --target novasvg_docs

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: build/docs/docs/html/
        retention-days: 5

  build-coverage:
    # needs: build-and-test
    # if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install python dependencies
      run: pip install pytest-cov nanobind
    
    - name: Install coverage tools
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov

    - name: Configure CMake with coverage
      run: |
        cmake -B build \
          -DNOVASVG_BUILD_EXAMPLES=OFF \
          -DNOVASVG_BUILD_PYTHON=ON \
          -DNOVASVG_BUILD_TESTS=ON \
          -DNOVASVG_BUILD_DOCS=OFF

    - name: Generate coverage report
      run: cmake --build build --target novasvg_coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: build/coverage/total/coverage.lcov
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/coverage/
        retention-days: 5

  build-single-header:
    needs: build-coverage
    # if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.x'
    
    - name: Install quom
      run: pip install quom

    - name: Configure CMake with DIST_DIR
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DNOVASVG_BUILD_EXAMPLES=OFF \
          -DNOVASVG_BUILD_PYTHON=OFF \
          -DNOVASVG_BUILD_TESTS=ON \
          -DNOVASVG_BUILD_DOCS=OFF \
          -DNOVASVG_DIST_DIR=build/dist

    - name: Build single-header
      run: cmake --build build --target dist_header

    - name: Create beta release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: __beta__
        name: "Beta Release"
        body: "Single-header distribution of NovaSVG"
        prerelease: true
        draft: false
        files: build/dist/novasvg/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download documentation artifact
      uses: actions/download-artifact@v4
      with:
        name: documentation
        path: ./docs

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4