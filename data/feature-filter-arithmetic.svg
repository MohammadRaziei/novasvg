<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150">
  <defs>
    <filter id="arith" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceGraphic" dx="0" dy="0" result="base"/>
      <feFlood flood-color="#ff0000" flood-opacity="1" result="redflood"/>
      <feComposite in="redflood" in2="SourceAlpha" operator="in" result="redshape"/>
      <feOffset in="redshape" dx="40" dy="0" result="redshifted"/>
      <feComposite in="redshifted" in2="base" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="mult"/>
      <feMerge>
        <feMergeNode in="base"/>
        <feMergeNode in="mult"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="75" r="55" fill="#00ff00" filter="url(#arith)"/>
</svg>
