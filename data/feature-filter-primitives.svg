<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150">
  <defs>
    <!-- feMerge: manual drop shadow built from primitives, should look like feDropShadow -->
    <filter id="manualShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blurred"/>
      <feOffset in="blurred" dx="4" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.5" result="floodFill"/>
      <feComposite in="floodFill" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="30" y="30" width="100" height="90" fill="#3498db" filter="url(#manualShadow)"/>
  <circle cx="280" cy="75" r="55" fill="#e67e22" filter="url(#manualShadow)"/>
</svg>
