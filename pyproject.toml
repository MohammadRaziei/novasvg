[build-system]
requires = [
    "scikit-build-core>=0.8.0",
    "nanobind>=2.0.0",
    "numpy>=1.20.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "novasvg"
dynamic = ["version"]
description = "NovaSVG is a header-only SVG library with Python bindings"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Mohammad Raziei", email = "mohammadraziei1375@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # "numpy>=1.20.0",
    "numpy"
]
scripts.novasvg = "novasvg.__main__:main"


[project.urls]
Homepage = "https://github.com/mohammadraziei/novasvg"
Repository = "https://github.com/mohammadraziei/novasvg"
Documentation = "https://mohammadraziei.github.io/novasvg"

[tool.scikit-build.cmake]
args = ["-DCMAKE_BUILD_TYPE=Release"]
build-type = "Release"
define.CMAKE_BUILD_PARALLEL_LEVEL = 8
define.NOVASVG_BUILD_PYTHON = "ON"
define.NOVASVG_BUILD_TESTS = "OFF"
define.NOVASVG_BUILD_DOCS = "OFF"
define.NOVASVG_BUILD_EXAMPLES = "OFF"


[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "include/novasvg/novasvg.h"
regex = '''(?sx)
\#define \s+ NOVASVG_VERSION_MAJOR \s+ (?P<major>\d+) .*?
\#define \s+ NOVASVG_VERSION_MINOR \s+ (?P<minor>\d+) .*?
\#define \s+ NOVASVG_VERSION_PATCH \s+ (?P<patch>\d+) .*?
'''
result = "{major}.{minor}.{patch}"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:(ast.Str|Attribute s|ast.NameConstant|ast.Num) is deprecated:DeprecationWarning:_pytest",  # Python 3.12
]
testpaths = ["tests/python"]

